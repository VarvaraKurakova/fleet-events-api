services:
  postgres:
    image: postgres:16
    container_name: fleet_events_postgres
    environment:
      POSTGRES_DB: fleet_events
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fleet_events_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fleet_events_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet_events_api
    command: [ "/app/api" ]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://fleet:fleet@postgres:5432/fleet_events?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      DEVICE_API_KEY: "dev-api-key"
      WORKER_CONCURRENCY: "4"
      WORKER_PREFETCH: "4"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet_events_worker
    command: [ "/app/worker" ]
    restart: unless-stopped
    environment:
      POSTGRES_DSN: "postgres://fleet:fleet@postgres:5432/fleet_events?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      WORKER_CONCURRENCY: "4"
      WORKER_PREFETCH: "4"
    depends_on:
      - postgres
      - rabbitmq

volumes:
  postgres_data:
